    <rect x="334" y="130" width="28" height="120" rx="14"/>
    <rect x="368" y="130" width="28" height="120" rx="14"/>
    <rect x="254" y="154" width="164" height="14" rx="7"/>
    <rect x="254" y="212" width="164" height="14" rx="7"/>
    <rect x="274" y="244" width="12" height="20" rx="3"/>
    <rect x="376" y="244" width="12" height="20" rx="3"/>
  </g>
  <circle cx="420" cy="161" r="12" fill="#0b4f8a"/>

