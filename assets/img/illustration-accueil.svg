  <rect x="20" y="262" width="440" height="8" rx="4" fill="#b9c4d1"/>

  <!-- Chaleur -->
  <g fill="none" stroke="#c2410c" stroke-width="9" stroke-linecap="round">
    <path d="M290 112c-14-16 14-26 0-44"/>
    <path d="M336 112c-14-16 14-26 0-44"/>
    <path d="M382 112c-14-16 14-26 0-44"/>
  </g>

